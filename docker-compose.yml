# Sales Data Agent: Streamlit app (8501) + TruLens dashboard (8001) sharing one
# persistent TruLens database volume. Secrets come from an optional local .env.
# Host ports are configurable to avoid conflicts: APP_PORT (default 8501) and
# DASHBOARD_PORT (default 8001, loopback only), e.g. `APP_PORT=8502 docker compose up`.

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  sales-data-agent:
    <<: *hardening
    build: .
    image: sales-data-agent:latest
    ports:
      - "${APP_PORT:-8501}:8501"
    env_file:
      - path: .env
        required: false
    environment:
      - TRULENS_DATABASE_URL=sqlite:////app/data/default.sqlite
    volumes:
      - trulens-data:/app/data
    restart: unless-stopped

  trulens-dashboard:
    <<: *hardening
    image: sales-data-agent:latest
    # Unauthenticated UI that exposes every recorded trace: loopback only, no secrets.
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-8001}:8001"
    environment:
      - TRULENS_DATABASE_URL=sqlite:////app/data/default.sqlite
    volumes:
      - trulens-data:/app/data
    command:
      - python
      - -c
      - |
        from trulens.core.database.connector.default import DefaultDBConnector
        from trulens.core.session import TruSession
        from trulens.dashboard import run_dashboard
        session = TruSession(connector=DefaultDBConnector(database_url="sqlite:////app/data/default.sqlite"))
        run_dashboard(session=session, port=8001, address="0.0.0.0", force=True).wait()
    healthcheck:
      disable: true
    depends_on:
      sales-data-agent:
        condition: service_healthy
    restart: unless-stopped

volumes:
  trulens-data:

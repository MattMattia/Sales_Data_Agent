name: CI

on:
  push:
    branches: [main, "fix/**", "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Separate groups per event so a pull_request run (whose ref can resolve to
  # the base branch) never cancels a push run on main, and vice versa.
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  MPLBACKEND: Agg
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  quality-and-security:
    name: Quality & security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Static compilation
        run: python -m py_compile state.py prompts.py sandbox.py artifacts.py i18n.py tools.py nodes.py graph.py evals.py app.py

      - name: Scan tracked files for leaked secrets
        run: |
          pattern='(sk-(proj-)?[A-Za-z0-9_-]{20,}|tvly-[A-Za-z0-9_-]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----|xox[baprs]-[A-Za-z0-9-]{10,})'
          placeholders='your-|-here|example|placeholder|dummy|xxxx'
          matches=$(git ls-files -z | xargs -0 grep -I -n -E "$pattern" | grep -v -i -E "$placeholders" || true)
          if [ -n "$matches" ]; then
            echo "$matches"
            echo "::error::Potential secret committed to the repository (see matches above)."
            exit 1
          fi
          tracked_env=$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v -E '(^|/)\.env\.template$' || true)
          if [ -n "$tracked_env" ]; then
            echo "::error::Environment files must not be committed: $tracked_env"
            exit 1
          fi
          echo "No secrets detected."

  test-suite:
    name: Test suite
    needs: quality-and-security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        run: python -m pytest -v --tb=short

  e2e-smoke-test:
    name: E2E smoke test (Mock Fallback)
    needs: quality-and-security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SALES_AGENT_SKIP_DOTENV: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the multi-agent graph end to end
        run: python graph.py

      - name: Run the TruLens evaluation suite
        run: python evals.py

  docker-image:
    name: Docker image build & health check
    needs: quality-and-security
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate the compose file
        run: docker compose config --quiet

      - name: Build the image
        run: docker build --tag sales-data-agent:ci .

      - name: Start the container and wait until it is healthy
        run: |
          docker run --detach --name sales-data-agent-ci --publish 8501:8501 sales-data-agent:ci
          for attempt in $(seq 1 40); do
            status=$(docker inspect --format '{{.State.Health.Status}}' sales-data-agent-ci)
            echo "attempt ${attempt}: ${status}"
            if [ "$status" = "healthy" ]; then
              break
            fi
            sleep 3
          done
          if [ "$status" != "healthy" ]; then
            docker logs sales-data-agent-ci
            echo "::error::Container did not become healthy."
            exit 1
          fi
          curl --fail --silent --show-error http://localhost:8501/_stcore/health

      - name: Check runtime hardening
        run: |
          uid=$(docker exec sales-data-agent-ci id -u)
          if [ "$uid" != "10001" ]; then
            echo "::error::Container runs as UID ${uid}, expected 10001 (appuser)."
            exit 1
          fi
          if docker exec sales-data-agent-ci sh -c 'ls -a /app | grep -E "^\.env$"'; then
            echo "::error::A .env file was baked into the image."
            exit 1
          fi
          echo "Runs as appuser (10001) and ships no .env."

      - name: Stop the container
        if: always()
        run: docker rm --force sales-data-agent-ci || true
